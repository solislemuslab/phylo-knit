# Run the test suite on every pull request and on every push to master.
name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Java runs the bundled LEV1ATHAN jars
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # juliacall downloads Julia and PhyloNetworks into ~/.julia on first use;
      # keep them between runs so that later runs start quickly
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-${{ runner.os }}-${{ hashFiles('src/Server/juliapkg.json') }}

      - run: pip install -r requirements-dev.txt

      - run: pytest
