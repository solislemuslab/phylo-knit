<span class="vbox bg-light flex-column mb-2 border-dark">
    <button class="button" id="refresh" onclick="location.reload(true)" disabled>Try another one</button>
    <br>
    <br>
    <select  style="right: 20px;" class="btn mb-2 mb-md-0 btn-tertiary btn-block dropdown-toggle v"id="transfer_reason" name="transfer_reason"
            onchange="selectInputType(this.value)">
        <option value="type">Select file type</option>
        <option value="pf">Parenthetical format</option>
        <option value="Triplets">Triplets</option>
        <option value="HYDE format">HYDE format</option>
    </select>
    <input type="file" class="btn btn-tertiary btn-round chooseButton" id="file" style="position:absolute;left:400px;top:0px;visibility:hidden;">
    <br>
    <br>
    <br>
    <br>
 
    <div class="btn btn-tertiary" style="right: 20px;visibility:hidden;" id="textDiv">
    <input  class = "" id="textThreshold" type="text" placeholder="p-value threshold (e.g. 0.05)" style="right: 20px;visibility:hidden;">
    <i class="fa fa-question-circle"  id ="symb" style="visibility:hidden;" aria-hidden="true" data-toggle = "tooltip" data-placement="bottom" title = "Please enter the p-value threshold here"></i>
  </div>
    <br>


    <input id="parenthetical" type="text" style="visibility:hidden;" placeholder="Enter Newick format (e.g. (B:6.0,(A:5.0,C:3.0,E:4.0):5.0,D:11.0);)">

    <br>
    <button class="button btn mb-2 mb-md-0 btn-tertiary btn-block btn-round v" onclick="onClickCreateNetwork()" id="createNetwork" style="text-align:center;right: 20px;padding-left: 0;" disabled><div class="icon icon-round d-flex align-items-center justify-content-center">
      <img src="graph_icon_144306.png" style="width: 50%;height: 50%;" alt=""></div>Create Network</button>
      
      <br>
    <button class="button btn mb-2 mb-md-0 btn-tertiary btn-block btn-round v"  onclick="removeNodesAction()" id="updateNetwork" style="text-align:center;right: 20px;padding-left: 0;" disabled><div class="icon icon-round d-flex align-items-center justify-content-center">
      <img src="graph_icon_144306.png" style="width: 50%;height: 50%;" alt=""></div>Update Network</button>
      <br>
      <br>
    <div id="displayed-leaves">
        <label id="displayed-leaves-title">Displayed Leaves</label><br>
    </div>
    <br>
</span>


<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
  <h1 class="h2" style="padding-left: 15px;"> Network Canvas</h1>
  
  <div class="col-md-3 btn mb-2 mb-md-0 btn-tertiary btn-block btn-round" id = "dwn-div" style="left: 15%;visibility: hidden;">
    <input class  = "v" type="button" id="dwn-btn" value="Download Parenthetical">
      <div class="icon icon-round d-flex align-items-center justify-content-center">
        <i class="ion-ios-cloud-download"></i>

      </div>
    </button>
  </div>
  <div class="col-md-3">
    <button type="button" class="btn mb-2 mb-md-0 btn-tertiary btn-block btn-round v" style = "visibility: hidden;" onclick="saveImg()" id = "downloadPng"><span>Download Image</span> 
      <div class="icon icon-round d-flex align-items-center justify-content-center">
        <i class="ion-ios-cloud-download"></i>
      </div>
    </button>
    </div>
  </div>
</div>

</div>
