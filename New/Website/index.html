<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Phylogenetic Network Visualizer</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>


    <link href="styles.css" rel="stylesheet">
    <link href="http://maxcdn.bootstrapcdn.com/font-awesome/4.1.0/css/font-awesome.min.css" rel="stylesheet">



</head>
<body>

<div class="top"><h1 class="center" style="color: #AF9965">Phylogenetic Network Visualizer</h1>
</div>

<div class="vbox">
    <!-- <button class="button">Choose File</button> -->
    <button class="button" id="refresh" onclick="location.reload(true)">Try another one</button>
    <br>
    <br>
    <select class=button id="transfer_reason" name="transfer_reason"
            onchange="selectInputType(this.value)">
        <option value="type">Select file type</option>
        <option value="pf">Parenthetical format</option>
        <option value="Triplets">Triplets</option>
        <!--option value="dna">DNA format</option -->
        <option value="HYDE format">HYDE format</option>
    </select>
    <br>
    <br>
    <br>
    <br>
    
    <input id="textThreshold" type="text" placeholder="P-value threshold (e.g. 0.05)">
    <i class="fa fa-question-circle"  id ="symb" aria-hidden="true" data-toggle = "tooltip" data-placement="bottom" title = "Please enter the P value threshold here"></i>

    <br>

    <input id="parenthetical" type="text" placeholder="Enter Newick format (e.g. (B:6.0,(A:5.0,C:3.0,E:4.0):5.0,D:11.0);)">

    <br>
    <button class="button" onclick="onClickCreateNetwork()" id="createNetwork">Create Network</button>
    <br>
    <div id="placeholder">
        <label>Displayed Leaves</label><br>
    </div>
    <br>
    <button class="button" onclick="removeNodesAction()" id="updateNetwork">Update Network</button>
</div>
<div class = "downloadSVG">
    <button class = "button" onclick="saveImg()" id="downloadPng" style="float: top;float: right;">Download Image</button>
</div>
<!-- <textarea id="text-val" rows="4">This is the content of my file</textarea><br/> -->
<div class = "downloadSVG">
<input class  = "button" type="button" id="dwn-btn" value="Download Parenthetical" style="float: top;float: right;visibility: hidden;"/>
</div>
<div class="container" id="loader">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
</div>
<!-- <h3>This example loads a file (or multiple files) that are selected by a user from their local drive.  If the file is an image, an image element is displayed.  For a text file, a paragraph element is created to display the text.</h3> -->
<script src="libraries/d3.v4.min.js"></script>
<script src="libraries/d3-dot-graph.js"></script>
<script src="libraries/p5.js" type="text/javascript"></script>
<script src="libraries/download.js" type="text/javascript"></script>
<script src="libraries/p5.dom.js" type="text/javascript"></script>
<script src="libraries/p5.sound.js" type="text/javascript"></script>
<h2 id="instruct" style="text-align: center">Please select the file format of your input data</h2>

<svg id="chartId"
     width="1900" height="1500"
     viewBox="-400 1200 4000 10"
     perserveAspectRatio="xMidYMid">
</svg>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
<script>
$(function () {
  $('[data-toggle="tooltip"]').tooltip()
})
</script>
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
<script src="/scripts/snippet-javascript-console.min.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.7.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/save-svg-as-png/1.4.17/saveSvgAsPng.js"></script>
<script src = "downloadSVG.js"></script>
<script src="testUserInput.js"></script>
<script src="sketch.js" type="text/javascript"></script><script>
    function saveImg(){
    svg = document.getElementsByTagName("svg")
    saveSvgAsPng(svg[0],"pic.png")
    }

</script>



</html>
