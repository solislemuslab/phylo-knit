<!DOCTYPE html>
<meta charset="utf-8">

<!-- Load d3.js -->
<script src="https://d3js.org/d3.v4.js"></script>
<script src="https://unpkg.com/@hpcc-js/wasm@0.3.11/dist/index.min.js"></script>
<script src="https://unpkg.com/d3-graphviz@3.0.5/build/d3-graphviz.js"></script>
<!-- Create a div where the circle will take place -->
<div id="dataviz_basicZoom"></div>

<script>
x = `
strict digraph G1 {
internal1000 -> internal1001
internal1000 -> internal1005
internal1001 -> internal1002
internal1002 -> 2
internal1002 -> 6
internal1005 -> 5
internal1005 -> internal1007
internal1007 -> 4
internal1007 -> internal1009
internal1009 -> 3
internal1009 -> internal1001
internal1001 -> internal1002
internal1002 -> 2
internal1002 -> 6
}
`


    // append the svg object to the body of the page
    var svg = d3.select("#dataviz_basicZoom")
      .append("svg")
        .attr("width",  460)
        .attr("height",  460)
        .call(d3.zoom().on("zoom", function () {
           svg.attr("transform", d3.event.transform)
        }))
      .append("g")

    svg
      .graphviz().renderDot(x)
    
    </script>
